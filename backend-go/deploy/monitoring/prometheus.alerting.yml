global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: personal-ai-os-go
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [backend:9091]
        labels: {role: api}
  - job_name: personal-ai-os-go-worker
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [index, review, delivery]
        type: A
        port: 9091
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: role
