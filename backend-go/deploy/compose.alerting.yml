# Explicit opt-in after compose.monitoring.yml; receiver configuration is operator-owned.
services:
  prometheus:
    volumes:
      - ./monitoring/${GO_PROMETHEUS_ALERTING_CONFIG:-prometheus.alerting.combined.yml}:/etc/prometheus/prometheus.yml:ro
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,mode=1777"]
    command: ["--config.file=/etc/alertmanager/alertmanager.json", "--storage.path=/alertmanager", "--cluster.listen-address="]
    volumes:
      - ${GO_ALERTMANAGER_CONFIG:?set an explicit absolute GO_ALERTMANAGER_CONFIG}:/etc/alertmanager/alertmanager.json:ro
      - go-alertmanager:/alertmanager
    networks: [private]
volumes:
  go-alertmanager:
