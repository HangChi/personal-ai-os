global:
  scrape_interval: 15s
scrape_configs:
  - job_name: personal-ai-os
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:9091"]
  - job_name: personal-ai-os-worker
    metrics_path: /actuator/prometheus
    file_sd_configs:
      - files: ["/etc/prometheus/worker-targets/*.json"]
        refresh_interval: 15s
