<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    与 src/components/AppLogo.vue 的 tile 变体同一造型、同一几何。
    favicon 不能引用 CSS 变量（文件被浏览器直接当文档加载，拿不到 :root），
    所以这里把 el-color-primary / el-color-primary-dark-2 的亮色值写死。
    改主色时必须一并改下面 rect 的渐变两处色值，否则页签图标会悄悄漂移
    （改造前的问题正是如此：favicon 是 EP 蓝 #409eff，界面是靛蓝 #4f46e5）。

    几何：环 R=7.6 / 线宽 2.9 / 缺口正负 42 度（中心负 30 度）/ 点 r=1.95。
    端点为 butt（不是 round）：round cap 会各外扩 1.45 单位、共吃掉缺口 2.9 单位，
    16px 渲染下缺口会完全糊掉。详见 AppLogo.vue 文件头的参数扫描记录。

    ⚠️ 这个注释里绝对不能出现两个连续的短横线。XML 注释的正文不允许 "double hyphen"
    （连中文破折号 U+2014 打两个也不行），一旦出现整份 SVG 就是**非法 XML**，
    浏览器会静默丢弃整个图标，页签上只剩一个空白方块。上一版正是栽在这里。
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3f38b7" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#g)" />
  <path
    d="M 23.434 17.580 A 7.6 7.6 0 1 1 18.349 8.772"
    fill="none"
    stroke="#ffffff"
    stroke-width="2.9"
    stroke-linecap="butt"
  />
  <circle cx="22.582" cy="12.200" r="1.95" fill="#ffffff" />
</svg>
