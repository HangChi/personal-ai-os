# ============================================================
# 前端容器内的 nginx 配置
#
# 两件事：托管 SPA（含深链接回退），以及把 /api 反代给后端。
# ============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 multipart 上限对齐（6MB 文件 / 8MB 请求）。
    # 这里给到 20MB 是因为前端允许选 20MB 的附件，超限由后端给出可读提示，
    # 不该让 nginx 先一步返回一个没有 JSON 信封的 413。
    client_max_body_size 20m;

    # ---- 静态资源：内容哈希命名，可以长缓存 ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- API 反代 ----
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- SSE 的四条必需品（少一条就会「流莫名中断」）----
        #
        # 1) proxy_buffering off：不关的话 nginx 会把 SSE 攒在缓冲区里，
        #    客户端看到的是「一片空白 → 整段内容同时出现」，心跳也失去意义。
        # 2) X-Accel-Buffering: no：应用侧显式要求关闭缓冲，双保险。
        # 3) Connection ""：清掉逐跳头，保持长连接干净。
        # 4) 超时 300s > 应用侧 120s —— 必须让**应用**先超时并给出 error 事件，
        #    否则用户看到的是「连接被重置」，而不是可读的错误提示。
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;
    }

    # ---- SPA 回退 ----
    # 放最后：/api 与 /assets 先匹配，其余全部交给 index.html，
    # 否则刷新 /settings 这类前端路由会得到 nginx 的 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不缓存：它是所有资源哈希的入口，
    # 缓存住会让用户在新版本发布后继续加载旧的 assets 路径
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
