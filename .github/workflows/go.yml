name: Go Candidate

on:
  push:
    branches: [go]
    paths: ['backend/**', 'backend-go/**', 'frontend/**', 'scripts/migration/**', 'scripts/workspace/**', 'scripts/automation/**', 'specs/033-go-rewrite/**', 'specs/034-task-workspace/**', 'specs/035-safe-automation/**', '.github/workflows/go.yml', '.env.example', 'docs/mcp.md']
  pull_request:
    paths: ['backend/**', 'backend-go/**', 'frontend/**', 'scripts/migration/**', 'scripts/workspace/**', 'scripts/automation/**', 'specs/033-go-rewrite/**', 'specs/034-task-workspace/**', 'specs/035-safe-automation/**', '.github/workflows/go.yml', '.env.example', 'docs/mcp.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '4'
      APP_DOTENV_ENABLED: 'false'
      GO_DOTENV_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Prepare isolated test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          docker info > /dev/null
          mkdir -p "$RUNNER_TEMP/go-reports"
          echo "GO_TEST_GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GO_TEST_GOPATH=$(go env GOPATH)" >> "$GITHUB_ENV"
      - name: Cache pinned dependencies
        run: |
          (cd backend-go && go mod download && go mod verify)
          (cd backend && ./mvnw -B --no-transfer-progress -DskipTests -Dapp.dotenv.enabled=false package)
      - name: Go race, vet and build
        working-directory: backend-go
        shell: bash
        run: |
          set -o pipefail
          go test -race -p 1 -count=1 -timeout=20m ./... 2>&1 | tee "$RUNNER_TEMP/go-reports/race.log"
          go vet -tags=integration ./...
          go build ./...
      - name: Migration scripts and immutable baseline
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s scripts/migration -p 'test_*.py' 2>&1 | tee "$RUNNER_TEMP/go-reports/scripts.log"
          node --test scripts/migration/test_chrome_push_diagnostics.mjs scripts/migration/test_real_model_transport.mjs
          python3 -m unittest discover -s scripts/workspace -p 'test_*.py'
          python3 scripts/migration/go_inventory.py check
          python3 scripts/migration/go_config_disposition.py
          python3 scripts/migration/go_p8_test_progress.py
          python3 scripts/migration/go_p8_inventory_progress.py
          git diff --exit-code -- backend/src/main/resources/db/migration
      - name: Current budget acceptance on Java and Go
        shell: bash
        run: |
          set -euo pipefail
          for backend in java go; do
            python3 scripts/migration/run_go_e2e_tests.py --backend "$backend" --mode budget \
              --output "$RUNNER_TEMP/go-reports/current-budget-$backend" \
              2>&1 | tee "$RUNNER_TEMP/go-reports/current-budget-$backend.log"
          done
      - name: Disposable TLS PostgreSQL regressions
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/migration/run_go_postgres_tests.py --tls --package task --package confirmation 2>&1 | tee "$RUNNER_TEMP/go-reports/postgres-business.log"
          python3 scripts/migration/run_go_postgres_tests.py --tls --package app --run '^TestP8' 2>&1 | tee "$RUNNER_TEMP/go-reports/postgres-p8.log"
      - name: Workspace and automation database coverage
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/migration/run_go_postgres_tests.py --tls --package calendar --package knowledge --package workflow --package maintenance --package search --run '^Test(CalendarExchange|CaptureAtomicVersions|ReadOnlyWorkflows|MaintenanceCenter|KnowledgeBody)' 2>&1 | tee "$RUNNER_TEMP/go-reports/postgres-features.log"
          python3 scripts/automation/run_checks.py --upgrade-from 42 2>&1 | tee "$RUNNER_TEMP/go-reports/automation-upgrade.log"
      - name: Unchanged demo recipe on a disposable Go fixture
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/migration/run_go_demo_seed_tests.py 2>&1 | tee "$RUNNER_TEMP/go-reports/demo-seed.log"
      - name: Upload candidate validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-candidate-validation
          path: ${{ runner.temp }}/go-reports
          if-no-files-found: ignore
