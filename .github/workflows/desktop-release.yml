name: Desktop Release Draft

on:
  workflow_dispatch:
  push:
    branches: [codex/desktop-installers]
    paths: ['specs/040-desktop-installers/release-request.json']

permissions:
  contents: write
  actions: read

concurrency:
  group: desktop-release-draft
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify native build evidence and upload release draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop/scripts/publish-draft.cjs
