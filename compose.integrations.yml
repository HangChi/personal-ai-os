# 本地可选基础设施：docker compose --env-file .env.integrations.local -f compose.integrations.yml --profile cache up -d
name: personal-ai-os-integrations
services:
  redis:
    profiles: [cache]
    image: redis:8.2.1-alpine
    restart: unless-stopped
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_PASSWORD" --maxmemory 128mb --maxmemory-policy allkeys-lru']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redis-data:/data]
  rabbitmq:
    profiles: [queue]
    image: rabbitmq:4.4.0-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: personalos
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
volumes:
  rabbitmq-data:
  redis-data:
