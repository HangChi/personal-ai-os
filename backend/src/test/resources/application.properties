# ============================================================
# 测试期覆盖项
#
# 关闭提醒调度：@Scheduled 在 @SpringBootTest 里同样会跑，
# 而集成测试各自有 @BeforeEach 清理逻辑。若调度在测试中途触发并写入 reminder，
# 会让「断言行数」这类用例间歇性失败（典型的 flaky，且极难复现）。
# 需要验证扫描行为的测试直接调用 ReminderScanner.scan(instant)，时间由测试给。
# ============================================================
app.calendar.scan-enabled=false
