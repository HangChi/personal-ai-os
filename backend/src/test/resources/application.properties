# ============================================================
# 测试期覆盖项
#
# 关闭提醒调度：@Scheduled 在 @SpringBootTest 里同样会跑，
# 而集成测试各自有 @BeforeEach 清理逻辑。若调度在测试中途触发并写入 reminder，
# 会让「断言行数」这类用例间歇性失败（典型的 flaky，且极难复现）。
# 需要验证扫描行为的测试直接调用 ReminderScanner.scan(instant)，时间由测试给。
# ============================================================
app.calendar.scan-enabled=false

# 限流在测试期关闭。
#
# 它是**进程内单例**：配置相同的 @SpringBootTest 会共享同一个 Spring 上下文，
# 于是一个令牌桶要服务整个测试套件的所有类。全量运行会在一分钟内打出远超 60 次
# 的对话请求，后半程的用例就会收到与自身逻辑无关的 429 —— 典型的间歇性失败。
#
# 限流本身的正确性由 TokenBucketRateLimiterTest 与 RateLimitFilterTest 直接覆盖，
# 它们不加载 Spring，因此不受这一行影响。
app.rate-limit.enabled=false

# 附件孤儿巡检在测试期关闭：它按「数据库引用」反向清理磁盘，
# 而集成测试会临时造附件文件，巡检一旦在测试中途跑起来就会删掉它们 —— 典型的间歇性失败。
# 巡检逻辑不是被测对象，需要时直接调 pruneOrphans()。
app.chat.attachment-janitor-enabled=false
