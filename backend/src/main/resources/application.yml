# ============================================================
# Personal AI OS 后端配置
# 约定：所有可变项均可用同名环境变量覆盖；此处默认值仅供本地开发。
# ============================================================

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: personal-ai-os

  servlet:
    session:
      cookie:
        # 关闭 CSRF 后，SameSite=Lax 是主要防线：跨站 POST 不会带上会话 cookie。
        # 权衡与残余风险见 SecurityConfig 类注释与 README。
        same-site: lax
        http-only: true
    multipart:
      # 必须大于应用层的 5 MiB 上限，否则超限文件会在进入控制器之前
      # 被容器以 500 拒绝，用户看到的是"服务器错误"而不是"文件过大"。
      # 应用层校验负责给出可读提示，容器层只做最后一道兜底。
      max-file-size: 6MB
      max-request-size: 8MB

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:55432}/${POSTGRES_DB:personal_ai_os}
    username: ${POSTGRES_USER:personalos}
    password: ${POSTGRES_PASSWORD:personalos}
    hikari:
      pool-name: personalos-pool
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      # 结构由 Flyway 管理，此处只做校验，禁止自动建表（宪法原则 IV）
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  ai:
    # 重试策略。默认值（多次重试 + 指数退避）会让「模型不可达」时
    # 客户端长时间停留在无输出的流上，与本特性的 SC-006
    #（错误应在 10 秒内以 error 事件推送）冲突，故显式收紧。
    retry:
      max-attempts: ${AI_RETRY_MAX_ATTEMPTS:2}
      backoff:
        initial-interval: 500ms
        multiplier: 2
        max-interval: 2s
    model:
      # 聊天模型提供商：ollama | openai | none
      # 默认 ollama（本地、无需密钥），可用 AI_CHAT_PROVIDER 切换。
      # 该属性同时决定「哪一套 Starter 的自动配置生效」（research.md R-01）。
      chat: ${AI_CHAT_PROVIDER:ollama}
      # 嵌入模型提供商（阶段 3 起使用）：ollama | openai | none
      embedding: ${AI_EMBEDDING_PROVIDER:ollama}
      # 以下能力本阶段不需要；显式关闭，否则这些自动配置会尝试创建需要 API Key 的 Bean，
      # 使应用在无密钥时启动失败，破坏「开箱可跑」（research.md R-06）。
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      # 注意：Spring AI 2.0 的模型参数是「扁平」的，不是 chat.options.model
      # （实测 CONFIG_PREFIX = "spring.ai.ollama.chat"）。写错路径不会报错，只会静默不生效。
      chat:
        model: ${OLLAMA_CHAT_MODEL:qwen2.5:7b}
        temperature: 0.7
      embedding:
        # bge-m3 输出 1024 维，与 Flyway V4 的 vector(1024) 一致
        model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    openai:
      # 留空即可：仅在对应 provider 被启用时才会被读取
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      chat:
        model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
        temperature: 0.7
        options:
          # 透传给上游的额外请求体字段。
          #
          # 为什么需要它：DashScope 的 qwen3.x 是**思考型**模型，默认先输出一大段
          # reasoning 再给答案。实测同一问题 completion tokens 76（其中 46 是思考），
          # 关掉后降到 30；读图场景 70 → 15。对话/工具调用/读图三项关掉思考后均正常。
          #
          # 实测结论（2026-10-26，qwen3.8-flash）：
          #   - 工具调用：thinking 开关两种状态都能正确产生 tool_calls
          #   - 读图：两种状态转录结果一致
          #   - 所以关闭只是省 token 与等待，不损失能力
          #
          # ⚠️ 换回**官方 OpenAI** / DeepSeek 等不认这个字段的服务时，请把本段 extra-body
          #    整段注释掉 —— 只把 OPENAI_ENABLE_THINKING 改成 true 是不够的，
          #    参数仍然会被发出去，可能因未知参数被上游拒绝。
          #
          # 另注：占位符展开后是**字符串** "false"，不是布尔 false。
          # 实测 DashScope 能正确按 false 处理（reasoning_tokens=0）；
          # 若将来换用的服务对类型敏感，需改为 YAML 布尔字面量。
          extra-body:
            enable_thinking: ${OPENAI_ENABLE_THINKING:false}
      embedding:
        # 仅当 AI_EMBEDDING_PROVIDER=openai 时读取。
        # OpenAI 兼容服务（如 DashScope 百炼）复用同一个 base-url，
        # 即 {base-url}/embeddings —— 该端点需支持 POST，实测 DashScope 支持。
        model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
        # 不指定 dimensions：让模型用自身默认值，再由启动期维度守卫校验
        # （本项目向量列是 vector(1024)，实测 qwen3.7-text-embedding-flash 默认输出 1024）
    vectorstore:
      # 与 PgVectorStoreAutoConfiguration 的条件属性对齐
      type: pgvector
      pgvector:
        # 结构由 Flyway 拥有，**不要**让框架自动建表（宪法原则 IV）
        initialize-schema: false
        # 仅用于自描述；真实维度由迁移里的 vector(1024) 决定，启动期会校验两者一致
        dimensions: ${AI_KNOWLEDGE_EMBEDDING_DIMENSIONS:1024}
        index-type: HNSW
        # 必须与迁移里的索引 opclass 成对：COSINE_DISTANCE ↔ vector_cosine_ops
        distance-type: COSINE_DISTANCE
        table-name: vector_store
        schema-name: public
        max-document-batch-size: 10000

# 应用自身元信息，供健康检查接口读取
app:
  name: personal-ai-os
  # 由 Maven 资源过滤在构建时替换为 pom 中的 version
  version: @project.version@
  auth:
    # 访问控制（阶段 15）。默认关闭：本地单用户开箱即用，现有测试也依赖这一点。
    # 对公网开放前务必设为 true 并配置密码 —— 开启后 /api/v1/** 全部需要登录。
    # 若 enabled=true 而未设置密码，应用会**启动失败**（比「起来了但谁都能进」安全）。
    enabled: ${AUTH_ENABLED:false}
    username: ${AUTH_USERNAME:admin}
    password: ${AUTH_PASSWORD:}
  ai:
    # 送给模型的上下文条数上限。
    # 只影响「送给模型的内容」，不影响库中历史（见 data-model.md 的读写语义约定）。
    memory:
      max-messages: ${AI_MEMORY_MAX_MESSAGES:20}
      # 送给模型的消息正文总字符预算（近似 token 预算）。条数与体量是两个维度：
      # 20 条各 4000 字约 8 万字，足以撑爆多数模型的上下文窗口。
      # 按中文约 1.6 字符/token 估算，12000 字 ≈ 7.5k token，给输出留足空间。
      max-context-chars: ${AI_MEMORY_MAX_CONTEXT_CHARS:12000}
    system-prompt: ${AI_SYSTEM_PROMPT:你是 Personal AI OS 的个人助手。回答简洁、准确，默认使用中文，必要时使用列表。}
  # 上下文治理（阶段 22）：窗口之外的历史怎么处理。
  # 刻意与 app.ai 分开：那边是「用哪个模型、带多少窗口」，这里是「多出来的历史去哪」。
  context:
    summary:
      # 滚动摘要：把已滑出上下文窗口的历史压成一段文字，注入系统提示。
      # 关掉后既不生成也不注入，行为回到「只有窗口、更早的对话对模型不可见」。
      enabled: ${AI_CONTEXT_SUMMARY_ENABLED:true}
      # 触发一次摘要所需的最少新增消息条数（太小会每轮都调模型）
      min-messages: ${AI_CONTEXT_SUMMARY_MIN_MESSAGES:4}
      # 送给摘要模型的原文上限（按「从新往旧」截断）
      max-excerpt-chars: ${AI_CONTEXT_SUMMARY_MAX_EXCERPT:4000}
      # 摘要本身的长度上限
      max-summary-chars: ${AI_CONTEXT_SUMMARY_MAX_CHARS:1200}
    auto-memory:
      # 记忆自动沉淀：每轮结束后让模型抽取值得长期记住的陈述。
      # **默认关闭**：写错的记忆会变成永久约束，风险高于收益，请明确知情后再开。
      enabled: ${AI_CONTEXT_AUTO_MEMORY_ENABLED:false}
      # 每轮最多沉淀条数
      max-items: ${AI_CONTEXT_AUTO_MEMORY_MAX_ITEMS:3}
  knowledge:
    # 嵌入维度。必须与 Flyway V4 中 vector_store.embedding 的维度一致，
    # 否则应用**启动失败**并给出修复指引（与其在写入时才报原始 SQL 错误，不如启动就拦住）。
    embedding-dimensions: ${AI_KNOWLEDGE_EMBEDDING_DIMENSIONS:1024}
    top-k: ${AI_KNOWLEDGE_TOP_K:4}
    similarity-threshold: ${AI_KNOWLEDGE_SIMILARITY_THRESHOLD:0.3}
    max-file-size-bytes: ${AI_KNOWLEDGE_MAX_FILE_SIZE:5242880}
    # 允许的扩展名（阶段 10 起支持 PDF 文本层、Word docx 与图片）
    allowed-extensions: ${AI_KNOWLEDGE_ALLOWED_EXTENSIONS:md,markdown,txt,pdf,docx,png,jpg,jpeg,webp,gif}
    # 分块参数（2026-10-25 起改用结构感知切分，见 MarkdownStructureTextSplitter）
    # chunk-size-chars：目标块大小（字符）。结构切分尽量在标题/段落边界断开，
    #   而不是像原来那样按 token 硬切 —— 硬切会把一句话劈成两半，两块都只剩半边语义。
    chunk-size-chars: ${AI_KNOWLEDGE_CHUNK_SIZE_CHARS:1200}
    # 相邻块的字符重叠。0 表示不重叠：结构切分已在自然边界断开，
    #   重叠主要弥合跨节上下文；开太大块会膨胀、总块数上升。
    chunk-overlap-chars: ${AI_KNOWLEDGE_CHUNK_OVERLAP_CHARS:0}
    # 最小块字符数：低于它的块会并入相邻块；也是入库前拒收过短文档的阈值
    min-chunk-size-chars: ${AI_KNOWLEDGE_MIN_CHUNK_SIZE_CHARS:350}
    # 混合检索（2026-10-26）：向量通道 + 关键词通道，用 RRF 融合。
    # 关键词通道救的是「精确标识符」类查询（3PC / ip_hash / unknown）——
    # 这类 token 在嵌入空间里几乎没有语义，纯向量检索天然弱。
    # **保留开关是为了能 A/B 对比**：关掉即退回纯向量，评测可量化收益。
    hybrid-search-enabled: ${AI_KNOWLEDGE_HYBRID_ENABLED:true}
    # RRF 融合常数。越大，排名靠后的候选权重越小、融合越"温和"。60 是常用默认值。
    rrf-k: ${AI_KNOWLEDGE_RRF_K:60}
    # 关键词通道权重，相对向量通道（固定 1.0）。默认同权 —— 这是 129 条查询实测的结果：
    # 权重 0.5 时 R@1 84.5% / 未中 5，权重 1.0 时 R@1 86.0% / 未中 4。
    # 噪声靠 IDF 抑制（低频 token 权重大、高频 token 权重趋 0），而不是靠整体降权。
    keyword-channel-weight: ${AI_KNOWLEDGE_KEYWORD_CHANNEL_WEIGHT:1.0}
  calendar:
    # 定时扫描开关。测试里关闭（见 src/test/resources/application.properties），
    # 否则调度会在集成测试中途写入 reminder，与各用例的清理逻辑相互干扰，产生难以复现的偶发失败。
    scan-enabled: ${AI_CALENDAR_SCAN_ENABLED:true}
    scan-interval-ms: ${AI_CALENDAR_SCAN_INTERVAL_MS:60000}
    # 首次扫描延迟：避免与应用启动阶段争抢数据库连接
    scan-initial-delay-ms: ${AI_CALENDAR_SCAN_INITIAL_DELAY_MS:10000}
    # 扫描窗口向前看多远。必须覆盖「提醒提前量」，否则到点的提醒会被漏掉。
    scan-lookahead: ${AI_CALENDAR_SCAN_LOOKAHEAD:24h}
    # 扫描窗口向后看多远：覆盖日常重启造成的停机。
    # 刻意只回看 24 小时 —— 补发一周前的提醒只会制造噪音，而不是「不丢数据」。
    scan-lookback: ${AI_CALENDAR_SCAN_LOOKBACK:24h}
    # 任务提醒的默认提前量（日程可逐个覆盖）
    default-reminder-lead: ${AI_CALENDAR_DEFAULT_LEAD:15m}
    max-range-days: ${AI_CALENDAR_MAX_RANGE_DAYS:90}
    default-query-limit: ${AI_CALENDAR_DEFAULT_QUERY_LIMIT:100}
    max-query-limit: ${AI_CALENDAR_MAX_QUERY_LIMIT:500}

management:
  endpoints:
    web:
      exposure:
        # 阶段 0 只暴露健康与构建信息，不开放其它端点
        include: health,info
  endpoint:
    health:
      # 本地单用户场景下展示细节便于排错；
      # 若将来对公网开放，必须先接入认证并改为 when_authorized（宪法原则 II）
      show-details: always
  info:
    env:
      enabled: true

# 允许 /actuator/info 展示构建信息
info:
  app:
    name: ${spring.application.name}
    version: ${app.version}
