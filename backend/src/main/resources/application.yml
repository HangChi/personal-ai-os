# ============================================================
# Personal AI OS 后端配置
# 约定：所有可变项均可用同名环境变量覆盖；此处默认值仅供本地开发。
# ============================================================

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: personal-ai-os

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:55432}/${POSTGRES_DB:personal_ai_os}
    username: ${POSTGRES_USER:personalos}
    password: ${POSTGRES_PASSWORD:personalos}
    hikari:
      pool-name: personalos-pool
      maximum-pool-size: 10
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      # 结构由 Flyway 管理，此处只做校验，禁止自动建表（宪法原则 IV）
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# 应用自身元信息，供健康检查接口读取
app:
  name: personal-ai-os
  # 由 Maven 资源过滤在构建时替换为 pom 中的 version
  version: @project.version@

management:
  endpoints:
    web:
      exposure:
        # 阶段 0 只暴露健康与构建信息，不开放其它端点
        include: health,info
  endpoint:
    health:
      # 本地单用户场景下展示细节便于排错；
      # 若将来对公网开放，必须先接入认证并改为 when_authorized（宪法原则 II）
      show-details: always
  info:
    env:
      enabled: true

# 允许 /actuator/info 展示构建信息
info:
  app:
    name: ${spring.application.name}
    version: ${app.version}
